name: Deploy Model Atlas

on:
  push:
    branches:
      - main
      - cursor/dsv4-model-atlas-07dc
    paths:
      - "model-atlas/**"
      - ".github/workflows/deploy-model-atlas.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: model-atlas-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-atlas
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: model-atlas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build for GitHub Pages
        # Project site: https://<user>.github.io/vllm-ascend/
        run: npx vite build --base=/vllm-ascend/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: model-atlas/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
