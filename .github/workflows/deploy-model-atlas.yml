name: Deploy Model Atlas

on:
  push:
    branches:
      - main
    paths:
      - "model-atlas/**"
      - ".github/workflows/deploy-model-atlas.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: model-atlas-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-atlas
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: model-atlas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Prepare GitHub Pages files
        run: |
          # Relative base works at https://<user>.github.io/vllm-ascend/
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: model-atlas/dist

      - name: Upload branch artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-atlas-dist
          path: model-atlas/dist

  publish-gh-pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: model-atlas-dist
          path: dist

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          force_orphan: true
          commit_message: "docs: publish Model Atlas static site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Require Pages source GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            exit 0
          fi
          echo "::error title=GitHub Pages is not enabled::Open https://github.com/${GITHUB_REPOSITORY}/settings/pages and set Build and deployment → Source to GitHub Actions, then re-run this workflow. Public URL: https://yjyang62.github.io/vllm-ascend/"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
